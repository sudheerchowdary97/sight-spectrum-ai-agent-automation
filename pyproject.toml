# ─────────────────────────────────────────────────────────────────────────────
# Agentic Invoice-to-Payment Automation — project configuration
# ─────────────────────────────────────────────────────────────────────────────
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invoice-agent"
version = "0.1.0"
description = "Agentic AI prototype: ingest invoices from email, match against PO/GR in ERP, post Payment Journals with audit trail and human oversight."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Sudheer Chowdary" }]

# Runtime dependencies for the API service (kept lean; heavy ML libs are extras).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "structlog>=24.4",
    "httpx>=0.27",
    "tenacity>=9.0",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Agent / RAG / document-processing stack (Tasks 4-10).
agent = [
    "docling>=2.5",
    "llama-index>=0.11",
    "llama-index-vector-stores-postgres>=0.2",
    "llama-index-llms-ollama>=0.3",
    "llama-index-embeddings-ollama>=0.3",
    "langgraph>=0.2",
    "ollama>=0.3",
]
# Observability (Task 12).
obs = [
    "arize-phoenix>=5.0",
    "openinference-instrumentation-llama-index>=3.0",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
]
# Evaluation (Task 13).
eval = [
    "ragas>=0.2",
    "datasets>=3.0",
    "pandas>=2.2",
]
# Synthetic data generation (Task 1).
data = [
    "faker>=30.0",
    "jinja2>=3.1",
    "reportlab>=4.2",
    "fpdf2>=2.8",
    "pillow>=11.0",
]
# Developer tooling.
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pre-commit>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_agent"]

# ─────────────────────────────────────────────────────────────────────────────
# Tooling
# ─────────────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "PTH", "RUF"]
ignore = ["B008"]  # FastAPI uses function calls (Depends(...)) in defaults.

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
warn_return_any = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"

[tool.coverage.run]
source = ["invoice_agent"]
branch = true
