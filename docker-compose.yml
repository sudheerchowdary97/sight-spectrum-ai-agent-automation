# Agentic Invoice-to-Payment Automation — full local stack.
# Bring up with: `make up` (or `docker compose up -d --build`).

name: invoice-agent

services:
  # ─── PostgreSQL + PGVector (vector store & ERP/audit persistence) ──────────
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-invoice_agent}
      POSTGRES_USER: ${POSTGRES_USER:-invoice_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-invoice_agent}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-invoice_agent} -d ${POSTGRES_DB:-invoice_agent}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Ollama (local LLM provider) ───────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── Arize Phoenix (observability / tracing) ───────────────────────────────
  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"   # UI + OTLP HTTP collector
    environment:
      PHOENIX_WORKING_DIR: /data
    volumes:
      - phoenix:/data

  # ─── Mock ERP (SAP/Oracle/NetSuite stand-in) ───────────────────────────────
  mock-erp:
    build:
      context: .
      dockerfile: docker/mock_erp.Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx,sys; sys.exit(0 if httpx.get('http://localhost:8001/api/v1/health').status_code==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Agent API (FastAPI) ────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      OLLAMA_BASE_URL: http://ollama:11434
      ERP_BASE_URL: http://mock-erp:8001
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006
      # Import live source from the bind mount below (no rebuild on code edits).
      PYTHONPATH: /app/src
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      # Dev: mount source so code changes need only a restart, not a rebuild.
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./config:/app/config
    command:
      - uvicorn
      - invoice_agent.api.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
      mock-erp:
        condition: service_started
      phoenix:
        condition: service_started

volumes:
  pgdata:
  ollama:
  phoenix:
